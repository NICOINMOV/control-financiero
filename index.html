<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Control Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ============ VISTA: CONFIGURACIÓN ============ -->
  <section id="view-setup" data-view class="hidden min-h-screen flex items-center justify-center p-4">
    <form id="setup-form" class="card w-full max-w-md space-y-4" autocomplete="off">
      <div>
        <h1 class="text-xl font-semibold">Conectar con tu base de datos</h1>
        <p class="text-sm text-slate-500 mt-1">Se guarda solo en este navegador. No se sube a GitHub.</p>
      </div>
      <label class="block">
        <span class="label">URL de la Web App</span>
        <input name="url" type="url" required class="input" placeholder="https://script.google.com/macros/s/…/exec" />
      </label>
      <label class="block">
        <span class="label">API_KEY</span>
        <input name="key" type="password" required class="input" placeholder="xxxxxxxx-xxxx-…" />
      </label>
      <button type="submit" class="btn-primary w-full">Conectar</button>
    </form>
  </section>

  <!-- ============ VISTA: APP ============ -->
  <section id="view-app" data-view class="hidden">
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="font-semibold">Control Financiero</h1>
        <div class="flex gap-2">
          <button id="btn-refresh" class="btn-ghost" title="Actualizar">↻</button>
          <button id="btn-logout" class="btn-ghost">Desconectar</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">

      <!-- KPIs -->
      <section class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div class="card kpi"><span class="kpi-label">Ingresos del mes</span><span id="kpi-ingresos" class="kpi-value text-emerald-600">—</span></div>
        <div class="card kpi"><span class="kpi-label">Gastos del mes</span><span id="kpi-gastos" class="kpi-value text-red-600">—</span></div>
        <div class="card kpi"><span class="kpi-label">Balance</span><span id="kpi-balance" class="kpi-value">—</span></div>
        <div class="card kpi"><span class="kpi-label">Gastos esta semana</span><span id="kpi-semana" class="kpi-value">—</span></div>
        <div class="card kpi"><span class="kpi-label">Gastos hormiga (mes)</span><span id="kpi-hormiga" class="kpi-value text-amber-600 text-lg">—</span></div>
        <div class="card kpi"><span class="kpi-label">Gastado con crédito</span><span id="kpi-credito" class="kpi-value">—</span></div>
      </section>

      <div class="grid md:grid-cols-5 gap-6">
        <!-- Formulario -->
        <form id="mov-form" class="card md:col-span-2 space-y-3 self-start">
          <h2 class="font-semibold">Nuevo movimiento</h2>
          <div class="grid grid-cols-2 gap-3">
            <label><span class="label">Tipo</span>
              <select name="tipo" class="input"><option>Gasto</option><option>Ingreso</option></select>
            </label>
            <label><span class="label">Fecha</span>
              <input name="fecha" type="date" required class="input" />
            </label>
          </div>
          <label class="block"><span class="label">Monto</span>
            <input name="monto" type="number" min="1" step="1" required inputmode="numeric" class="input" placeholder="0" />
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label><span class="label">Categoría</span>
              <input name="categoria" list="categorias" required class="input" placeholder="Comida" />
            </label>
            <label><span class="label">Medio</span>
              <select name="medio" class="input">
                <option>Débito</option><option>Crédito</option><option>Efectivo</option><option>Transferencia</option>
              </select>
            </label>
          </div>
          <datalist id="categorias">
            <option>Comida</option><option>Supermercado</option><option>Transporte</option><option>Café</option>
            <option>Delivery</option><option>Hogar</option><option>Salud</option><option>Entretención</option>
            <option>Suscripciones</option><option>Sueldo</option><option>Clientes</option>
          </datalist>
          <label class="block"><span class="label">Descripción</span>
            <input name="descripcion" class="input" placeholder="Opcional" />
          </label>
          <label class="flex items-center gap-2 text-sm">
            <input name="esHormiga" type="checkbox" class="h-4 w-4 accent-amber-500" />
            Es gasto hormiga
          </label>
          <button type="submit" class="btn-primary w-full">Guardar</button>
        </form>

        <!-- Lista -->
        <section class="card md:col-span-3 overflow-x-auto">
          <h2 class="font-semibold mb-2">Últimos movimientos</h2>
          <table class="w-full text-sm">
            <tbody id="mov-body">
              <tr><td class="py-6 text-center text-slate-400">Cargando…</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
